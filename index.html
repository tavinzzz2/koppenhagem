const ALT = CONFIG.legendas;

const WaIcon = ({s=22}) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>`;
const Cta = ({children, cls=""}) => html`<a class=${"btn text-sm sm:text-base "+cls} href=${PAY} target="_blank" rel="noopener">${children}</a>`;

const Price = ({light}) => {
  const has = !!CONFIG.preco;
  return html`<div class=${light ? "text-[var(--creme)]" : ""}>
    ${CONFIG.precoOriginal && html`<div class="line-through opacity-60 text-lg">${CONFIG.precoOriginal}</div>`}
    <div class="serif text-5xl sm:text-6xl font-semibold text-[var(--ouro-claro)] leading-none">${has ? CONFIG.preco : "Valor sob consulta"}</div>
    <div class="mt-2 text-sm opacity-80">${has ? CONFIG.condicao : "Receba o valor atualizado pelo WhatsApp."}</div>
    ${CONFIG.disponibilidade && html`<div class="mt-2 text-sm font-medium text-[var(--ouro-claro)]">${CONFIG.disponibilidade}</div>`}
  </div>`;
};

const Hero = () => html`
<header class="dark-sec dots relative overflow-hidden" style=${{background:"radial-gradient(120% 90% at 70% 20%,#7d1727 0%,#4a0d16 55%,#2f070d 100%)"}}>
  <div class="mx-auto max-w-6xl px-5 pt-8 pb-14 sm:pt-12 sm:pb-20 grid md:grid-cols-2 gap-10 items-center">
    <div class="md:order-2 rise2">
      <div class="bob mx-auto max-w-[460px]"><div class="arch aspect-[1/1.02] p-5 sm:p-8 grid place-items-center">
        <img src=${IMG[0]} alt=${ALT[0]} width="1000" height="945" fetchpriority="high" class="blend w-full h-full object-contain"/>
      </div></div>
    </div>
    <div class="md:order-1 text-center md:text-left">
      <p class="serif italic text-2xl text-[var(--ouro-claro)] rise">Kopenhagen</p>
      <h1 class="serif text-4xl sm:text-6xl font-semibold leading-[1.05] mt-3 rise2">Um Natal que se abre como presente.</h1>
      <p class="mt-5 text-lg opacity-90 max-w-md mx-auto md:mx-0 rise3">O Kit de Panetone Kopenhagen reúne panettone e chocolates finos em uma embalagem feita para presentear.</p>
      <div class="mt-8 flex flex-col items-center md:items-start gap-6 rise3">
        ${Price({light:true})}
        ${Cta({children:"QUERO GARANTIR MEU KIT"})}
      </div>
    </div>
  </div>
</header>`;

const Gallery = () => {
  const [i,setI] = useState(0), [open,setOpen] = useState(false);
  useEffect(()=>{ if(!open) return; const k=e=>{ if(e.key==="Escape")setOpen(false); if(e.key==="ArrowRight")setI(x=>(x+1)%IMG.length); if(e.key==="ArrowLeft")setI(x=>(x+IMG.length-1)%IMG.length); }; window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k); },[open]);
  return html`<div>
    <button class="block w-full rounded-3xl p-4 sm:p-8 cursor-zoom-in" style=${{background:"var(--panel)"}} onClick=${()=>setOpen(true)} aria-label="Ampliar foto">
      <img key=${i} src=${IMG[i]} alt=${ALT[i]} class="blend rise mx-auto w-full max-h-[540px] object-contain" loading="lazy"/>
    </button>
    <p class="mt-3 text-center text-sm" style=${{color:"var(--sec-mute)"}}>${ALT[i]}</p>
    <div class="mt-4 grid grid-cols-4 gap-3">
      ${IMG.map((s,n)=>html`<button key=${n} class="thumb rounded-xl p-1.5" style=${{background:"var(--panel)"}} aria-current=${n===i} aria-label=${"Ver foto "+(n+1)} onClick=${()=>setI(n)}><img src=${s} alt="" class="blend w-full aspect-square object-contain" loading="lazy"/></button>`)}
    </div>
    ${open && html`<div class="fixed inset-0 z-50 grid place-items-center p-4" style=${{background:"rgba(20,5,8,.92)"}} role="dialog" aria-modal="true" onClick=${()=>setOpen(false)}>
      <button class="absolute top-4 right-4 text-3xl text-white w-11 h-11" aria-label="Fechar" style=${{marginTop:"env(safe-area-inset-top,0px)"}}>×</button>
      <div class="rounded-2xl p-4 max-w-3xl w-full" style=${{background:"var(--panel)"}} onClick=${e=>e.stopPropagation()}>
        <img src=${IMG[i]} alt=${ALT[i]} class="blend w-full max-h-[75vh] object-contain"/>
        <div class="flex justify-between mt-2 text-[var(--bordo)]">
          <button class="px-4 py-2 text-2xl" aria-label="Anterior" onClick=${()=>setI((i+IMG.length-1)%IMG.length)}>‹</button>
          <button class="px-4 py-2 text-2xl" aria-label="Próxima" onClick=${()=>setI((i+1)%IMG.length)}>›</button>
        </div>
      </div>
    </div>`}
  </div>`;
};

const Kit = () => html`
<section class="sec py-16 sm:py-24" id="kit"><div class="mx-auto max-w-6xl px-5 grid md:grid-cols-5 gap-10 items-center">

</div></section>`;
